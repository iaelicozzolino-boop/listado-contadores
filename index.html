<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap">
  <title>Listado de contadores</title>
  <style>
    /* ===== Sistema de diseño Marina Ibiza ===== */
    :root {
      --bg: #FFFFFF;
      --surface-soft: #F4F6F8;
      --surface-pressed: #E3E8EF;
      --line: #E1E5EA;
      --text: #14181F;
      --text-dim: #6B7480;
      --brand: #1F3A68;
      --brand-tint: #E8EEF6;
      --focus-ring: #E1E9F4;
      --danger-bg: #FBECEC;
      --danger-fg: #A3282B;
      --font-sans: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
      --radius-sm: 9px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --control-h: 44px;
      --input-h: 48px;
      --shadow-float: 0 10px 30px rgba(20, 24, 31, .2);
      color-scheme: light;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button { font-family: var(--font-sans); cursor: pointer; }

    /* ---------- Cabecera ---------- */
    header {
      max-width: 960px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 28px) 24px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
    }

    .header-logo { width: min(220px, 60vw); height: auto; display: block; }

    header h1 {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .ver { font-size: 11.5px; font-weight: 500; color: var(--text-dim); opacity: .8; }

    /* ---------- Fecha, selector y carga de PDF ---------- */
    .date-bar {
      width: 100%;
      max-width: 520px;
      margin-top: 22px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      text-align: left;
    }

    .date-bar label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .date-bar input[type="date"] {
      height: var(--input-h);
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #fff;
      color: var(--text);
      font: 600 16px var(--font-sans);
      outline: none;
      min-width: 0;
      width: 100%;
    }

    .date-bar input[type="date"]:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--focus-ring); }

    .mode-wrap { width: 100%; max-width: 520px; margin-top: 12px; }

    .mode-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      background: var(--surface-soft);
      border-radius: var(--radius-md);
    }

    .mode-btn {
      min-height: var(--control-h);
      padding: 8px 6px;
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-dim);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.25;
    }

    .mode-btn.active { background: var(--brand); color: #fff; }

    .mode-count { display: block; font-size: 11.5px; font-weight: 600; opacity: .8; }

    .load-pdf-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: var(--control-h);
      margin-top: 10px;
      border: 1.5px dashed #A9B9D0;
      border-radius: var(--radius-md);
      background: #fff;
      color: var(--brand);
      font-size: 14px;
      font-weight: 700;
    }

    .load-pdf-btn:active { background: var(--surface-soft); }

    /* ---------- Pantalanes ---------- */
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 14px 24px 24px;
    }

    .pier-section { margin-top: 6px; }

    .pier-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: var(--control-h);
      padding: 0 4px;
      border: 0;
      background: none;
      color: var(--text);
      user-select: none;
      text-align: left;
    }

    .pier-toggle:active { opacity: .6; }

    .pier-dot { width: 10px; height: 10px; border-radius: 3px; background: var(--brand); flex: none; }

    .pier-name { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }

    .pier-rule { flex: 1; height: 1px; background: var(--line); }

    .chevron {
      width: 22px;
      height: 22px;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      transition: transform .2s ease-out;
    }

    .pier-toggle.expanded .chevron { transform: rotate(180deg); color: var(--brand); }

    .berths-container { display: none; padding: 10px 0 6px; }

    .berths-container.open { display: block; }

    .berth-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
    }

    .berth-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 14px;
    }

    .berth-name { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 10px; }

    .status-buttons { display: flex; gap: 8px; margin-bottom: 12px; }

    .status-btn {
      flex: 1;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #fff;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
    }

    .status-btn.active { background: var(--brand); border-color: var(--brand); color: #fff; }

    /* ---------- Casillas de lectura ---------- */
    .input-group {
      display: grid;
      grid-template-columns: 52px 1fr;
      align-items: center;
      gap: 8px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .field-wrap { display: flex; gap: 6px; min-width: 0; }

    .field-input {
      flex: 1;
      min-width: 0;
      height: var(--input-h);
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #fff;
      color: var(--text);
      font: 600 17px var(--font-sans);
      font-variant-numeric: tabular-nums;
      outline: none;
    }

    .field-input::placeholder { color: #B4BBC5; font-weight: 500; }

    .field-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--focus-ring); }

    .field-input.carried { background: var(--brand-tint); border-color: #7C9CC4; }

    .field-input.pending { background: #FFF3B0; border-color: #D9A900; }

    .field-input.broken { color: var(--danger-fg); font-weight: 700; }

    .r-btn {
      flex: 0 0 44px;
      width: 44px;
      height: var(--input-h);
      padding: 0;
      border: 0;
      border-radius: var(--radius-md);
      background: var(--danger-bg);
      color: var(--danger-fg);
      font-size: 15px;
      font-weight: 700;
    }

    .r-btn.on { background: var(--danger-fg); color: #fff; }

    .mic-btn {
      flex: 0 0 48px;
      width: 48px;
      height: var(--input-h);
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: var(--radius-md);
      background: var(--surface-soft);
      color: var(--brand);
    }

    .mic-btn:active, .r-btn:active { opacity: .6; }

    .mic-btn svg { width: 22px; height: 22px; }

    .mic-btn.listening {
      background: var(--danger-fg);
      color: #fff;
      animation: mic-pulse 1s infinite;
    }

    @keyframes mic-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(163, 40, 43, .45); }
      50% { box-shadow: 0 0 0 6px rgba(163, 40, 43, 0); }
    }

    .heard {
      grid-column: 1 / -1;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.35;
      color: var(--text-dim);
      word-break: break-word;
    }

    .heard:empty { display: none; }

    .heard.err { color: var(--danger-fg); }

    /* ---------- Barra inferior y avisos ---------- */
    .actions {
      position: sticky;
      bottom: 0;
      display: flex;
      gap: 8px;
      justify-content: center;
      padding: 12px 24px calc(env(safe-area-inset-bottom) + 12px);
      background: #fff;
      border-top: 1px solid var(--line);
    }

    .actions button {
      flex: 1;
      max-width: 240px;
      height: var(--control-h);
      padding: 0 16px;
      border: 0;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 700;
    }

    .btn-primary { background: var(--brand); color: #fff; }

    .btn-secondary { background: var(--surface-soft); color: var(--text); }

    .btn-primary:active, .btn-secondary:active { opacity: .6; }

    .status-message {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 84px);
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 32px);
      padding: 12px 18px;
      border-radius: 14px;
      background: var(--text);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      text-align: center;
      box-shadow: var(--shadow-float);
      z-index: 20;
      pointer-events: none;
      animation: toast-in .2s ease-out;
    }

    .status-message:empty { display: none; }

    @keyframes toast-in { from { transform: translate(-50%, 20px); opacity: 0; } }

    @media (max-width: 600px) {
      header { padding-left: 16px; padding-right: 16px; }
      main { padding-left: 16px; padding-right: 16px; }
      .berth-grid { grid-template-columns: 1fr; }
      .actions { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>

      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    }
    const dateInput = document.getElementById('readingDate');
    dateInput.value = localToday();
    let currentDate = dateInput.value;

    function notify(msg, ms = 4000) {
      const el = document.getElementById('statusMessage');
      el.textContent = msg;
      setTimeout(() => { el.textContent = ''; }, ms);
    }

    function initializeApp() {
      renderPiers();
      loadData();
      setMode(mode);
    }

    function renderPiers() {
      const mainContent = document.getElementById('mainContent');
      mainContent.innerHTML = '';

      Object.entries(piers).forEach(([pierName, berths]) => {
        const section = document.createElement('div');
        section.className = 'pier-section';

        const toggle = document.createElement('button');
        toggle.className = 'pier-toggle';
        toggle.innerHTML = `<span class="pier-dot"></span><span class="pier-name">Pantalán ${pierName}</span><span class="pier-rule"></span><span class="chevron"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>`;
        const container = document.createElement('div');
        container.className = 'berths-container';
        toggle.onclick = (e) => {
          e.preventDefault();
          toggle.classList.toggle('expanded');
          container.classList.toggle('open');
        };
        section.appendChild(toggle);

        const grid = document.createElement('div');
        grid.className = 'berth-grid';

        berths.forEach(berth => {
          const card = document.createElement('div');
          card.className = 'berth-card';

          const name = document.createElement('div');
          name.className = 'berth-name';
          name.textContent = berth;
          card.appendChild(name);

          const statusButtons = document.createElement('div');
          statusButtons.className = 'status-buttons';
          const occupiedBtn = document.createElement('button');
          occupiedBtn.className = 'status-btn';
          occupiedBtn.textContent = 'Ocupado';
          occupiedBtn.id = `status_ocupado_${berth}`;
          occupiedBtn.onclick = (e) => {
            e.preventDefault();
            occupiedBtn.classList.toggle('active');
          };
          statusButtons.appendChild(occupiedBtn);
          card.appendChild(statusButtons);

          const inputGroup = document.createElement('div');
          inputGroup.className = 'input-group';
          [['Luz', 'light'], ['Agua', 'water']].forEach(([label, key]) => {
            const l = document.createElement('div');
            l.className = 'field-label';
            l.textContent = label;
            inputGroup.appendChild(l);
            const wrap = document.createElement('div');
            wrap.className = 'field-wrap';
            const input = document.createElement('input');
            input.type = 'text';
            input.inputMode = 'decimal';
            input.className = 'field-input';
            input.id = `${key}_${berth}`;
            input.placeholder = '0.000';
            input.addEventListener('focus', () => { clearPending(input); clearCarried(input); });
            input.addEventListener('input', () => {
              if (input.value.trim().toLowerCase() === 'r') input.value = 'R';
              clearPending(input); clearCarried(input); setHeard(input, ''); syncBroken(input);
            });
            wrap.appendChild(input);
            const rb = document.createElement('button');
            rb.type = 'button';
            rb.className = 'r-btn';
            rb.id = `r_${key}_${berth}`;
            rb.textContent = 'R';
            rb.setAttribute('aria-label', `Marcar ${label} de ${berth} como contador roto`);
            rb.onclick = (e) => { e.preventDefault(); toggleBroken(input); };
            wrap.appendChild(rb);
            const mic = document.createElement('button');
            mic.type = 'button';
            mic.className = 'mic-btn';
            mic.id = `mic_${key}_${berth}`;
            mic.setAttribute('aria-label', `Dictar ${label} de ${berth}`);
            mic.innerHTML = MIC_SVG;
            mic.onclick = (e) => { e.preventDefault(); toggleDictation(input, mic); };
            wrap.appendChild(mic);
            inputGroup.appendChild(wrap);
            const heard = document.createElement('div');
            heard.className = 'heard';
            heard.id = `heard_${key}_${berth}`;
            inputGroup.appendChild(heard);
          });
          card.appendChild(inputGroup);
          grid.appendChild(card);
        });

        container.appendChild(grid);
        section.appendChild(container);
        mainContent.appendChild(section);
      });
    }

    function readBerth(berth) {
      return {
        light: document.getElementById(`light_${berth}`).value.trim(),
        water: document.getElementById(`water_${berth}`).value.trim(),
        occupied: document.getElementById(`status_ocupado_${berth}`).classList.contains('active')
      };
    }

    function saveData(quiet) {
      let data = { date: currentDate, readings: {} };
      const stored = readStored(currentDate);
      if (stored) {
        data.readings = stored.readings || {};                     // conserva los amarres que no están en pantalla
        if (stored.baseFrom) data.baseFrom = stored.baseFrom;      // de qué fecha se copiaron las lecturas
      }
      Object.values(piers).flat().forEach(berth => {
        const r = readBerth(berth);
        const old = data.readings[berth];
        data.readings[berth] = {
          light: r.light, water: r.water, status: r.occupied ? 'ocupado' : null,
          pending: { light: isPending('light', berth), water: isPending('water', berth) },
          carried: { light: isCarried('light', berth), water: isCarried('water', berth) }
        };
        if (old && old.prev) data.readings[berth].prev = old.prev;
      });
      localStorage.setItem(`readings_${currentDate}`, JSON.stringify(data));
      if (!quiet) notify('✓ Datos guardados');
    }

    function setMode(m) {
      if (!MODES[m]) return;
      if (m !== mode) {
        if (activeDictation) { activeDictation.silent = true; try { activeDictation.rec.abort(); } catch (e) {} }
        saveData(true);
        mode = m;
        piers = MODES[m].piers;
        try { localStorage.setItem('contadores_modo', m); } catch (e) {}
        renderPiers();
        loadData();
        notify(`Mostrando: ${MODES[m].label} (${Object.values(piers).flat().length} amarres)`);
      }
      Object.keys(MODES).forEach(k => {
        const b = document.getElementById('mode_' + k);
        b.classList.toggle('active', k === m);
        b.setAttribute('aria-selected', k === m ? 'true' : 'false');
        document.getElementById('count_' + k).textContent =
          `${Object.keys(MODES[k].piers).length} pantalanes · ${Object.values(MODES[k].piers).flat().length} amarres`;
      });
    }

    function resetFields() {
      Object.values(piers).flat().forEach(berth => {
        document.getElementById(`light_${berth}`).value = '';
        document.getElementById(`water_${berth}`).value = '';
        document.getElementById(`status_ocupado_${berth}`).classList.remove('active');
        ['light', 'water'].forEach(key => {
          const el = document.getElementById(`${key}_${berth}`);
          clearPending(el);
          clearCarried(el);
          setHeard(el, '');
          delete el.dataset.beforeR;
          syncBroken(el);
        });
      });
    }

    function readStored(date) {
      try { return JSON.parse(localStorage.getItem(`readings_${date}`) || 'null'); } catch (e) { return null; }
    }

    function hasValues(readings, berths) {
      return (berths || Object.keys(readings || {})).some(b => {
        const v = (readings || {})[b];
        return v && (v.light || v.water || v.status === 'ocupado');
      });
    }

    // Convierte unas lecturas (de otra fecha o de un PDF) en el punto de partida de la fecha actual:
    // mismos valores, en azul hasta revisarlos, y guardados como "lectura anterior" para marcar cambios en el PDF.
    function carriedRecord(light, water, status) {
      light = light || ''; water = water || ''; status = status === 'ocupado' ? 'ocupado' : null;
      return { light, water, status, pending: { light: false, water: false },
               carried: { light: !!light, water: !!water }, prev: { light, water, status } };
    }

    function latestEarlierDate(date) {
      let best = null;
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        const m = /^readings_(\d{4}-\d{2}-\d{2})$/.exec(k || '');
        if (!m || m[1] >= date) continue;
        const d = readStored(m[1]);
        if (!d || !hasValues(d.readings)) continue;
        if (!best || m[1] > best) best = m[1];
      }
      return best;
    }

    function carryFromPrevious() {
      const from = latestEarlierDate(currentDate);
      if (!from) return null;
      const src = readStored(from).readings;
      const data = { date: currentDate, baseFrom: from, readings: {} };
      Object.entries(src).forEach(([b, v]) => { data.readings[b] = carriedRecord(v.light, v.water, v.status); });
      localStorage.setItem(`readings_${currentDate}`, JSON.stringify(data));
      return from;
    }

    function loadData() {
      resetFields();
      let saved = localStorage.getItem(`readings_${currentDate}`);
      const cur = readStored(currentDate);
      if (!saved || !cur || !hasValues(cur.readings)) {          // fecha sin nada escrito: se parte de la última lectura
        const from = carryFromPrevious();
        if (!from) return;
        notify(`Lecturas copiadas del ${formatDate(from)} (en azul). Toca cada casilla para revisarla.`, 9000);
        saved = localStorage.getItem(`readings_${currentDate}`);
      }
      const data = JSON.parse(saved);
      Object.entries(data.readings).forEach(([berth, v]) => {
        if (!document.getElementById(`light_${berth}`)) return;
        document.getElementById(`light_${berth}`).value = v.light || '';
        document.getElementById(`water_${berth}`).value = v.water || '';
        if (v.status === 'ocupado') document.getElementById(`status_ocupado_${berth}`).classList.add('active');
        if (v.pending && v.pending.light && v.light) markPending(document.getElementById(`light_${berth}`));
        if (v.pending && v.pending.water && v.water) markPending(document.getElementById(`water_${berth}`));
        if (v.carried && v.carried.light && v.light) markCarried(document.getElementById(`light_${berth}`));
        if (v.carried && v.carried.water && v.water) markCarried(document.getElementById(`water_${berth}`));
        syncBroken(document.getElementById(`light_${berth}`));
        syncBroken(document.getElementById(`water_${berth}`));
      });
    }

    // ---------- CARGAR LECTURAS DESDE UN PDF DE LA APP (v4) ----------
    const PDF_TAG = 'CONTADORES1:';
    function encodeData(obj) { return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))); }
    function decodeData(b64) { return JSON.parse(decodeURIComponent(escape(atob(b64)))); }

    async function loadFromPdf(file) {
      let payload = null;
      try {
        const text = new TextDecoder('latin1').decode(await file.arrayBuffer());
        const m = new RegExp(PDF_TAG + '([A-Za-z0-9+/=]+)').exec(text);
        if (m) payload = decodeData(m[1]);
      } catch (e) { console.error(e); }
      if (!payload || !payload.r) {
        notify('Este PDF no tiene datos de la app. Solo sirven los PDF creados con esta versión (4.0) o posterior.', 10000);
        return;
      }
      saveData(true);
      const berths = Object.keys(payload.r);
      const data = readStored(currentDate) || { date: currentDate, readings: {} };
      if (hasValues(data.readings, berths)) {
        const ok = confirm(`Este móvil ya tiene lecturas del ${formatDate(currentDate)} en estos amarres.\n\n` +
                           `¿Sustituirlas por las del PDF del ${formatDate(payload.date)} (${berths.length} amarres)?`);
        if (!ok) { notify('No se ha cambiado nada.'); return; }
      }
      berths.forEach(b => { const [l, w, o] = payload.r[b]; data.readings[b] = carriedRecord(l, w, o ? 'ocupado' : null); });
      data.date = currentDate;
      data.baseFrom = payload.date;
      localStorage.setItem(`readings_${currentDate}`, JSON.stringify(data));
      loadData();
      const shown = berths.filter(b => document.getElementById(`light_${b}`)).length;
      notify(`Cargadas las lecturas del ${formatDate(payload.date)}: ${berths.length} amarres` +
             (shown < berths.length ? ` (${shown} en esta vista)` : '') + '. Están en azul hasta que las revises.', 10000);
    }

    document.getElementById('pdfFile').addEventListener('change', (e) => {
      const f = e.target.files && e.target.files[0];
      e.target.value = '';
      if (f) loadFromPdf(f);
    });

    dateInput.addEventListener('change', () => {
      saveData();                       // guarda en la fecha anterior
      if (!dateInput.value) { dateInput.value = currentDate; return; }
      currentDate = dateInput.value;    // pasa a la nueva fecha
      loadData();
    });

    // ---------- PDF ----------
    function formatDate(iso) {
      const [y, m, d] = iso.split('-');
      return `${d}/${m}/${y}`;
    }

    // Un pantalán entra en el PDF si tiene algo rellenado (luz, agua u ocupado).
    // Si entra, salen todos sus amarres y los campos vacíos se escriben como 0.
    const norm = v => String(v || '').trim().replace(',', '.');
    function collectSections() {
      const stored = readStored(currentDate) || { readings: {} };
      const sections = [];
      Object.entries(piers).forEach(([pier, berths]) => {
        const data = berths.map(b => [b, readBerth(b)]);
        if (!data.some(([, r]) => r.light || r.water || r.occupied)) return;
        sections.push({
          pier,
          rows: data.map(([b, r]) => [b, r.occupied ? 'Sí' : 'No', r.light || '0', r.water || '0']),
          changed: data.map(([b, r]) => {
            if (!stored.baseFrom) return false;            // sin lecturas anteriores no hay nada con qué comparar
            const p = (stored.readings[b] && stored.readings[b].prev) || { light: '', water: '' };
            return norm(r.light) !== norm(p.light) || norm(r.water) !== norm(p.water);
          })
        });
      });
      return sections;
    }

    function pdfPayload() {
      const r = {};
      Object.values(piers).flat().forEach(b => {
        const v = readBerth(b);
        r[b] = [v.light, v.water, v.occupied ? 1 : 0];
      });
      return { v: 1, date: currentDate, mode, r };
    }

    function buildPdf(sections) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4' });
      const W = doc.internal.pageSize.getWidth();
      let y = 18;
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(18);
      doc.text('Listado de Contadores', W / 2, y, { align: 'center' });
      y += 10;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(12);
      doc.text(`Fecha de lectura: ${formatDate(currentDate)}  ·  ${MODES[mode].label}`, 14, y);
      y += 4;
      const stored = readStored(currentDate) || {};
      if (stored.baseFrom) {
        y += 5;
        doc.setFillColor(163, 40, 43);
        doc.circle(16, y - 1.2, 1.4, 'F');
        doc.setFontSize(10);
        doc.text(`Lectura distinta a la anterior (${formatDate(stored.baseFrom)})`, 20, y);
      }
      if (sections.some(s => s.rows.some(r => isBroken(r[2]) || isBroken(r[3])))) {
        y += 5;
        doc.setFontSize(10);
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(163, 40, 43);
        doc.text('R', 15, y);
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(0, 0, 0);
        doc.text('= contador roto', 20, y);
      }
      doc.setProperties({ title: `Listado de Contadores ${formatDate(currentDate)}`, keywords: PDF_TAG + encodeData(pdfPayload()) });

      sections.forEach(({ pier, rows, changed }) => {
        doc.autoTable({
          startY: y + 4,
          head: [
            [{ content: `Pantalán ${pier}`, colSpan: 4, styles: { halign: 'left', fillColor: [31, 58, 104], textColor: 255 } }],
            ['Amarre', 'Ocupado', 'Luz', 'Agua']
          ],
          body: rows,
          theme: 'grid',
          styles: { fontSize: 10, cellPadding: 2 },
          headStyles: { fillColor: [244, 246, 248], textColor: [20, 24, 31] },
          columnStyles: {
            0: { cellWidth: 34 },
            1: { cellWidth: 34, halign: 'center' },
            2: { cellWidth: 57, halign: 'right' },
            3: { cellWidth: 57, halign: 'right' }
          },
          didParseCell: (d) => {
            if (d.section === 'body' && d.column.index >= 2 && isBroken(d.cell.raw)) {
              d.cell.styles.textColor = [163, 40, 43];
              d.cell.styles.fontStyle = 'bold';
            }
            // la fila de títulos de columna se alinea igual que sus datos
            if (d.section === 'head' && d.row.index === 1) {
              d.cell.styles.halign = [ 'left', 'center', 'right', 'right' ][d.column.index];
            }
          },
          didDrawCell: (d) => {
            if (d.section === 'body' && d.column.index === 0 && changed[d.row.index]) {
              doc.setFillColor(163, 40, 43);
              doc.circle(d.cell.x + d.cell.width - 4, d.cell.y + d.cell.height / 2, 1.4, 'F');
            }
          },
          margin: { left: 14, right: 14 }
        });
        y = doc.lastAutoTable.finalY + 2;
      });

      const pages = doc.getNumberOfPages();
      doc.setFontSize(9);
      for (let i = 1; i <= pages; i++) {
        doc.setPage(i);
        doc.text(`Página ${i} de ${pages}`, W - 14, 290, { align: 'right' });
      }
      return doc.output('blob');
    }

    // Orden: 1) menú de compartir del móvil; 2) capacidad "downloads" de Claude; 3) descarga normal.
    // Devuelve { via, why }; "why" explica por qué no se pudo usar el menú de compartir.
    async function deliverPdf(blob, filename) {
      const file = new File([blob], filename, { type: 'application/pdf' });
      let why = '';
      if (!navigator.share || !navigator.canShare) {
        why = 'no está disponible en este navegador';
      } else if (!navigator.canShare({ files: [file] })) {
        why = 'no admite compartir archivos aquí';
      } else {
        try {
          await navigator.share({ files: [file], title: filename });
          return { via: 'shared' };
        } catch (e) {
          if (e && e.name === 'AbortError') return { via: 'declined' };
          why = (e && e.name === 'NotAllowedError') ? 'está bloqueado en este entorno' : `falló (${e && e.name})`;
        }
      }
      try {
        const dl = window.claude && await window.claude.use('downloads');
        if (dl) { await dl.save({ filename, data: blob }); return { via: 'saved', why }; }
      } catch (e) {
        if (e && e.code === 'declined') return { via: 'declined' };
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      return { via: 'downloaded', why };
    }

    async function createPdf() {
      if (!(window.jspdf && window.jspdf.jsPDF)) { notify('No se pudo cargar el generador de PDF. Comprueba la conexión.'); return; }
      const pend = document.querySelectorAll('.field-input.pending');
      const carr = document.querySelectorAll('.field-input.carried');
      if ((pend.length || carr.length) && Date.now() - lastPendingWarn > 15000) {
        lastPendingWarn = Date.now();
        revealField((pend[0] || carr[0]));
        const parts = [];
        if (carr.length) parts.push(`${carr.length} ${carr.length === 1 ? 'casilla' : 'casillas'} con la lectura anterior sin revisar (en azul)`);
        if (pend.length) parts.push(`${pend.length} ${pend.length === 1 ? 'casilla dictada' : 'casillas dictadas'} sin verificar (en amarillo)`);
        notify(`Hay ${parts.join(' y ')}. Pulsa Crear PDF otra vez para generarlo igualmente.`, 12000);
        return;
      }
      saveData();
      const sections = collectSections();
      if (!sections.length) { notify('No hay nada rellenado para el PDF'); return; }
      try {
        const blob = buildPdf(sections);
        const r = await deliverPdf(blob, `Contadores_${currentDate}.pdf`);
        if (r.via === 'shared') notify('✓ PDF listo para compartir');
        else if (r.via !== 'declined') notify(`PDF guardado en el móvil. El menú de compartir ${r.why}.`, 9000);
      } catch (e) {
        notify('Error al crear el PDF');
        console.error(e);
      }
    }

    // ---------- DICTADO POR VOZ (v2.0) ----------
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const MIC_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/></svg>';
    let activeDictation = null;
    let lastPendingWarn = 0;

    // <parser>
    // Convierte lo que oye el navegador en un número. Si hay una sola palabra que no entiende, devuelve null (no adivina).
    const SPOKEN_DIGITS = { cero: '0', uno: '1', un: '1', una: '1', dos: '2', tres: '3', cuatro: '4', cinco: '5', seis: '6', siete: '7', ocho: '8', nueve: '9' };
    function parseSpokenNumber(text) {
      let s = String(text || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
      s = s.replace(/^[\s.,;:!?-]+|[\s.,;:!?-]+$/g, '');
      if (!s) return null;
      if (/^(r|erre|roto|rota|contador roto|esta roto)$/.test(s)) return 'R';
      if (s.replace(/[a-z]+|\d+|[.,]|\s/g, '') !== '') return null;
      const tokens = s.match(/[a-z]+|\d+|[.,]/g) || [];
      let out = '';
      let seps = 0;
      for (const t of tokens) {
        if (/^\d+$/.test(t)) out += t;
        else if (t === ',' || t === '.' || t === 'coma' || t === 'punto') { out += ','; seps++; }
        else if (SPOKEN_DIGITS[t] !== undefined) out += SPOKEN_DIGITS[t];
        else return null;
      }
      if (seps > 1) return null;
      if (out.startsWith(',') || out.endsWith(',')) return null;
      const digits = out.replace(',', '').length;
      if (digits < 1 || digits > 12) return null;
      return out;
    }
    // </parser>

    function setHeard(input, text, isErr) {
      const el = document.getElementById('heard_' + input.id);
      if (!el) return;
      el.textContent = text || '';
      el.classList.toggle('err', !!isErr);
    }
    function markPending(input) { input.classList.add('pending'); input.classList.remove('carried'); }
    function markCarried(input) { input.classList.add('carried'); }
    const isBroken = v => String(v || '').trim().toUpperCase() === 'R';
    function syncBroken(input) {
      const on = isBroken(input.value);
      input.classList.toggle('broken', on);
      const b = document.getElementById('r_' + input.id);
      if (b) { b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); }
    }
    // R = contador roto. Pulsar otra vez devuelve el valor que había antes.
    function toggleBroken(input) {
      if (isBroken(input.value)) input.value = input.dataset.beforeR || '';
      else { input.dataset.beforeR = input.value; input.value = 'R'; }
      clearPending(input); clearCarried(input); setHeard(input, '');
      syncBroken(input);
    }
    function clearCarried(input) { input.classList.remove('carried'); }
    function isCarried(key, berth) { return document.getElementById(`${key}_${berth}`).classList.contains('carried'); }
    function clearPending(input) { input.classList.remove('pending'); }
    function isPending(key, berth) { return document.getElementById(`${key}_${berth}`).classList.contains('pending'); }

    function revealField(input) {
      const container = input.closest('.berths-container');
      if (container && !container.classList.contains('open')) {
        container.classList.add('open');
        if (container.previousElementSibling) container.previousElementSibling.classList.add('expanded');
      }
      input.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }

    const DICTATION_ERRORS = {
      'not-allowed': 'Permiso de micrófono denegado. Actívalo en Chrome (candado junto a la dirección → Permisos).',
      'service-not-allowed': 'Permiso de micrófono denegado. Actívalo en Chrome (candado junto a la dirección → Permisos).',
      'network': 'Sin conexión: el dictado necesita internet.',
      'audio-capture': 'No se encuentra el micrófono.',
      'language-not-supported': 'El dictado en español no está disponible en este móvil.'
    };

    function toggleDictation(input, mic) {
      if (!SR) { notify('Este navegador no permite dictado por voz. Usa Chrome en Android.', 8000); return; }
      const cur = activeDictation;
      if (cur) {
        if (cur.mic === mic) { try { cur.rec.stop(); } catch (e) {} return; }   // mismo botón: parar y usar lo oído
        cur.silent = true;                                                      // otro botón: cerrar el anterior y empezar este
        cur.next = () => startDictation(input, mic);
        try { cur.rec.abort(); } catch (e) {}
        setTimeout(() => { if (cur.next) { const n = cur.next; cur.next = null; n(); } }, 600);
        return;
      }
      startDictation(input, mic);
    }

    function startDictation(input, mic) {
      const rec = new SR();
      rec.lang = 'es-ES';
      rec.interimResults = true;
      rec.continuous = false;
      rec.maxAlternatives = 5;
      const s = { rec, input, mic, final: null, interim: '', error: null, silent: false, next: null, timer: null };
      activeDictation = s;
      rec.onstart = () => { mic.classList.add('listening'); setHeard(input, 'Escuchando…'); };
      rec.onresult = (ev) => {
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          const r = ev.results[i];
          if (r.isFinal) s.final = Array.from(r).map(a => a.transcript);
          else s.interim = r[0].transcript;
        }
        if (!s.final) setHeard(input, `Oyendo: «${s.interim.trim()}»`);
      };
      rec.onerror = (ev) => { s.error = ev.error; };
      rec.onend = () => {
        clearTimeout(s.timer);
        mic.classList.remove('listening');
        if (activeDictation === s) activeDictation = null;
        if (s.next) { const n = s.next; s.next = null; n(); }
        if (s.silent) { setHeard(input, ''); return; }
        finishDictation(input, s);
      };
      s.timer = setTimeout(() => { try { rec.stop(); } catch (e) {} }, 10000);
      try {
        rec.start();
      } catch (e) {
        activeDictation = null;
        clearTimeout(s.timer);
        notify('No se pudo iniciar el micrófono. Inténtalo otra vez.');
      }
    }

    function finishDictation(input, s) {
      if (s.error && s.error !== 'no-speech' && s.error !== 'aborted') {
        const msg = DICTATION_ERRORS[s.error] || `Error de dictado (${s.error}).`;
        setHeard(input, msg, true);
        notify(msg, 8000);
        return;
      }
      const alts = (s.final && s.final.length) ? s.final : (s.interim ? [s.interim] : []);
      if (!alts.length) { setHeard(input, 'No he oído nada. Inténtalo otra vez.', true); return; }
      for (const t of alts) {
        const v = parseSpokenNumber(t);
        if (v !== null) {
          input.value = v;
          markPending(input);
          syncBroken(input);
          setHeard(input, `Oído: «${t.trim()}» → ${v === 'R' ? 'R (contador roto)' : v}`);
          return;
        }
      }
      setHeard(input, `No he entendido: «${alts[0].trim()}». Di los números uno a uno (ej. «uno dos tres coma cinco»).`, true);
    }

    initializeApp();
  </script>

</body>
